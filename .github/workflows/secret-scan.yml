name: Secret Scan

# Scans the git history for committed credentials (API keys, tokens, private
# keys) with gitleaks.
#
# It runs on pull requests and on push to main because a secret can reach main
# through a route that has no PR — a direct push, or a merge commit created in
# the GitHub UI.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # On pull_request events gitleaks-action lists the PR's commits through the
  # REST API (GET /pulls/{n}/commits) to know which range to scan. Without this
  # scope that call is a 403 and the job dies before scanning anything.
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks walks the commit history, not the working tree. With the
          # default shallow clone it would only ever see the tip commit, so a
          # secret added and then removed in a later commit would go unnoticed.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          # Used to post the findings back onto the pull request. The action is
          # free for personal repositories; organisation-owned repositories also
          # need a GITLEAKS_LICENSE secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
