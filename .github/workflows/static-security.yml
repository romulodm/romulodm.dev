name: Static Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: actions/setup-node@v4
        with:
          # Alinhado com o Dockerfile (node:22), ci.yml e security-review.yml.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:packages
      - uses: github/codeql-action/analyze@v3
