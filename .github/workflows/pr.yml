name: PR Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      portfolio: ${{ steps.filter.outputs.portfolio }}
      worker: ${{ steps.filter.outputs.worker }}
      packages: ${{ steps.filter.outputs.packages }}
      frontend: ${{ steps.filter.outputs.frontend }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.gitignore'
              - '.dockerignore'
              - 'README.md'
            portfolio:
              - 'portfolio/**'
            worker:
              - 'worker/**'
            packages:
              - 'packages/database/**'
              - 'packages/queues/**'
            frontend:
              - 'frontend/**'

  validate-packages:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci:packages

  validate-worker:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci:worker

  validate-portfolio:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.portfolio == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci:portfolio

  validate-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.portfolio == 'true' || needs.detect-changes.outputs.worker == 'true' || needs.detect-changes.outputs.packages == 'true' || needs.detect-changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Install Playwright browsers
        if: needs.detect-changes.outputs.portfolio == 'true' || needs.detect-changes.outputs.root == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke coverage
        if: needs.detect-changes.outputs.portfolio == 'true' || needs.detect-changes.outputs.root == 'true'
        run: npm run test:e2e

  validate-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.root == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run ci:frontend

  ci-status:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate-packages
      - validate-worker
      - validate-portfolio
      - validate-tests
      - validate-frontend
    if: always()
    steps:
      - name: Ensure required checks resolved
        env:
          PACKAGES_RESULT: ${{ needs.validate-packages.result }}
          WORKER_RESULT: ${{ needs.validate-worker.result }}
          PORTFOLIO_RESULT: ${{ needs.validate-portfolio.result }}
          TESTS_RESULT: ${{ needs.validate-tests.result }}
          FRONTEND_RESULT: ${{ needs.validate-frontend.result }}
        run: |
          $results = @($env:PACKAGES_RESULT, $env:WORKER_RESULT, $env:PORTFOLIO_RESULT, $env:TESTS_RESULT, $env:FRONTEND_RESULT)
          if ($results -contains 'failure' -or $results -contains 'cancelled') {
            Write-Error 'One or more scoped validation jobs failed.'
          } else {
            Write-Host 'PR validation complete.'
          }
        shell: pwsh
