name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual runs from the GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Connect and deploy to VPS ──────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true  # stops on first error
          script: |
            set -e

            echo "📦 Updating code..."
            cd ~/app
            git pull origin main

            echo "🔑 Updating .env..."
            # Rebuilds .env from secrets stored on the VPS
            # (file lives at ~/app/.env, outside Git)
            # To update a variable, do it manually via SSH
            # or use the "Sync .env" step below

            echo "🐳 Rebuilding changed services..."
            docker compose -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.prod.yml up -d --build \
              --no-deps \
              app worker

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deploy complete!"

      # ── 3. Health check after deploy ──────────────────────────
      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://romulodm.dev/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed! Status: $STATUS"
            exit 1
          fi
          echo "✅ App responding with status $STATUS"