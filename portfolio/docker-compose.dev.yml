version: '3.8'
name: 'romulodm.dev'

services:
  postgres:
    image: postgres:16-alpine
    container_name: romulodm-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  mailcatcher:
    image: sj26/mailcatcher
    container_name: mailcatcher
    env_file:
      - .env
    expose:
      - '${EMAIL_SMTP_PORT}'
      - '${EMAIL_HTTP_PORT}'
    ports:
      - '${EMAIL_SMTP_PORT}:1025'
      - '${EMAIL_HTTP_PORT}:1080'

  minio:
    image: minio/minio:latest
    container_name: romulodm-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - romulodm-network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    env_file:
      - .env
    ports:
      - '${UMAMI_PORT}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${UMAMI_DB}
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: romulodm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - romulodm-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  romulodm-network:
    driver: bridge
