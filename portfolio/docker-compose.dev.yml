version: '3.8'
name: 'romulodm.dev'

services:
  postgres:
    image: postgres:16-alpine
    container_name: romulodm-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  umami-db:
    image: postgres:16-alpine
    container_name: romulodm-umami-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${UMAMI_DB}
    ports:
      - "5433:5432"
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  mailcatcher:
    image: sj26/mailcatcher
    container_name: mailcatcher
    env_file:
      - .env
    expose:
      - '${SMTP_PORT}'
      - '${HTTP_PORT}'
    ports:
      - '${SMTP_PORT}:1025'
      - '${HTTP_PORT}:1080'

  minio:
    image: minio/minio:latest
    container_name: romulodm-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - romulodm-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: romulodm-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET_NAME} &&
        mc anonymous set download local/$${MINIO_BUCKET_NAME} &&
        echo '✅ Bucket $${MINIO_BUCKET_NAME} pronto.'
      "
    networks:
      - romulodm-network
    restart: "no"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    env_file:
      - .env
    ports:
      - '${UMAMI_PORT}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${UMAMI_DB}
      APP_SECRET: ${APP_SECRET}
      APP_URL: http://localhost:3001
      DEBUG: umami:*
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - romulodm-network


  waha:
    image: devlikeapro/waha
    ports:
      - "3002:3000"
    volumes:
      - ./waha-data:/app/.sessions
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS

  redis:
    image: redis:7-alpine
    container_name: romulodm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - romulodm-network

  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: romulodm-app
  #   env_file:
  #     - .env
  #   restart: unless-stopped
  #   environment:
  #     - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  #     - MINIO_ENDPOINT=${MINIO_ENDPOINT}
  #     - MINIO_PORT=${MINIO_PORT}
  #     - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
  #     - REDIS_URL=${REDIS_URL}
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - postgres
  #     - minio
  #     - redis
  #   networks:
  #     - romulodm-network

volumes:
  postgres_data:
  umami_postgres_data:
  minio_data:
  redis_data:

networks:
  romulodm-network:
    driver: bridge
