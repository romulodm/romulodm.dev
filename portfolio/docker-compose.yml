version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_blog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portfolio-network

  minio:
    image: minio/minio:latest
    container_name: portfolio-blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - portfolio-network

  minio-init:
    image: minio/mc:latest
    container_name: portfolio-blog-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/portfolio-blog --ignore-existing;
      mc anonymous set download myminio/portfolio-blog;
      exit 0;
      "
    networks:
      - portfolio-network

  # Descomente para rodar o Next.js no Docker (produção)
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: portfolio-blog-app
  #   restart: unless-stopped
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/portfolio_blog?schema=public
  #     - MINIO_ENDPOINT=minio
  #     - MINIO_PORT=9000
  #     - MINIO_PUBLIC_URL=http://localhost:9000
  #   ports:
  #     - "3000:3000"
