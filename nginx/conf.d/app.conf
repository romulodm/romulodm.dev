# ============================================================
#  romulodm.dev — configuração principal do virtual host
#  Expõe: Next.js app + MinIO arquivos públicos
# ============================================================

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name romulodm.dev www.romulodm.dev;

    # Renovação Let's Encrypt (Certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name romulodm.dev www.romulodm.dev;

    # ── Certificados (gerados pelo Certbot) ──────────────────
    ssl_certificate     /etc/letsencrypt/live/romulodm.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/romulodm.dev/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # HSTS (habilite só após confirmar que HTTPS funciona)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"            always;
    add_header X-Content-Type-Options   "nosniff"               always;
    add_header X-XSS-Protection         "1; mode=block"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── Limites gerais ───────────────────────────────────────
    client_max_body_size 10M; # sobrescrito por location quando necessário

    # ── Health check (monitoramento externo) ─────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Bloqueia arquivos sensíveis ──────────────────────────
    location ~ /\.(env|git|svn|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # ── Arquivos estáticos do Next.js (_next/static) ─────────
    location /_next/static/ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Assets estáticos (imagens, fontes, etc.) ─────────────
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;

        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── MinIO: apenas leitura pública do bucket ───────────────
    #    Acesso de escrita/admin fica dentro da rede Docker.
    #    URL pública: https://romulodm.dev/media/<objeto>
    location /media/ {
        limit_req zone=minio burst=40 nodelay;

        # Remove /media/ e envia para o bucket correto
        rewrite ^/media/(.*)$ /portfolio-blog/$1 break;

        proxy_pass http://minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Permite upload de arquivos grandes via app (server-side)
        client_max_body_size 100M;
        proxy_request_buffering off;

        # Cache agressivo para mídia
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        add_header Cache-Control "public, max-age=31536000";
    }

    # ── Bloqueia console do MinIO (porta 9001) ────────────────
    #    A porta 9001 NÃO deve ser exposta no docker-compose para
    #    produção. Este bloco é uma camada extra de segurança caso
    #    alguém tente acessar via path reverso.
    location /minio-console/ {
        deny all;
        return 403;
    }

    # ── App Next.js (tudo mais) ───────────────────────────────
    location / {
        limit_req zone=app burst=50 nodelay;

        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade"; # necessário para WebSocket / HMR
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;

        # Cache: nunca cache de respostas dinâmicas do Next
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}