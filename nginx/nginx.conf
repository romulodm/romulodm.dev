user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Oculta versão do nginx

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=app:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=minio:10m rate=20r/s;

    # Upstreams — nomes correspondem aos container_name no docker-compose
    upstream app_upstream {
        server romulodm-app:3000; # ajuste a porta conforme NEXT_PORT
        keepalive 32;
    }

    upstream minio_upstream {
        server romulodm-minio:9000;
        keepalive 16;
    }

    # -------------------------------------------------------
    # Bloco padrão: rejeita qualquer host não reconhecido
    # -------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 444; # fecha conexão sem resposta
    }

    # -------------------------------------------------------
    # Site principal (dev: default.conf | prod: app.conf)
    # -------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}