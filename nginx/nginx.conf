# ============================================================
#  Global nginx configuration — shared by dev, staging and production.
#
#  This file defines everything that lives at the `http` level: logging,
#  compression, rate-limit zones, cache storage and upstreams. The actual
#  virtual hosts live in conf.d/ and are pulled in at the bottom.
#
#  The SAME file is mounted in every environment, so anything added here must
#  work in all of them. Run `nginx/scripts/validate.sh` after editing — it
#  loads this config against a real nginx binary in both topologies.
# ============================================================

user nginx;
worker_processes auto;                  # one worker per CPU core
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;            # max simultaneous connections per worker
    use epoll;                          # efficient event model on Linux
    multi_accept on;                    # accept all pending connections at once
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    # $remote_addr is the real visitor IP thanks to the real_ip include below.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------
    # Performance
    # -------------------------------------------------------
    sendfile        on;                 # copy files kernel-side, skipping userspace
    tcp_nopush      on;                 # send full packets instead of dribbles
    tcp_nodelay     on;                 # but don't delay small ones on keepalive
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;                  # hide the nginx version from responses

    # -------------------------------------------------------
    # WebSocket / HTTP upgrade support
    # -------------------------------------------------------
    # Maps the client's Upgrade header to the right Connection value:
    #   client sent Upgrade  -> "upgrade"  (WebSocket handshake goes through)
    #   client sent nothing  -> ""         (header omitted, keepalive preserved)
    #
    # Used by conf.d/proxy-params.inc. Defined here because `map` is only valid
    # at the http level, and because both dev and prod need it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # -------------------------------------------------------
    # Search engine indexing, per hostname
    # -------------------------------------------------------
    # Staging serves the same content as the real site. Indexed, it becomes
    # duplicate content competing with production for the same keywords.
    #
    # Keyed on $host instead of an environment variable on purpose: the rule is
    # "this hostname must never be indexed", and tying it to the hostname means
    # no amount of wrong .env can turn it off. Used by security-headers.inc.
    #
    # An empty value makes nginx omit the header entirely, so production
    # responses are untouched.
    map $host $robots_tag {
        default            '';
        ~^staging\.        'noindex, nofollow';
    }

    # -------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------
    gzip on;
    gzip_vary on;                       # tell caches the response varies by encoding
    gzip_proxied any;                   # compress even proxied responses
    gzip_comp_level 6;                  # good ratio without burning CPU
    gzip_min_length 256;                # below this, compression costs more than it saves

    # `application/xml` (no +xml suffix) is the Content-Type Next.js uses for
    # /sitemap.xml. Without it in this list the biggest XML response on the site
    # would ship uncompressed: `text/xml` and `application/rss+xml` do not match it.
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml application/rss+xml
               application/atom+xml image/svg+xml;

    # -------------------------------------------------------
    # Real client IP (behind Cloudflare)
    # -------------------------------------------------------
    # With Cloudflare in front, $remote_addr becomes the edge IP. Every rate
    # limit zone would collapse into a single bucket and the first visitor would
    # eat everyone else's quota. This include restores the visitor's own IP.
    #
    # The file is generated by nginx/scripts/update-cloudflare-ips.sh (the
    # ranges change; re-run it periodically). While Cloudflare is not in front,
    # it only contains a comment and nothing changes.
    #
    # The wildcard is deliberate: with a glob, nginx accepts matching zero files
    # without complaining. A fixed-path `include` pointing at a missing file is
    # a startup [emerg] that takes the whole server down — and this file is
    # OPTIONAL by nature. An optional file must never be able to break boot.
    include /etc/nginx/conf.d/cloudflare-real-ip*.inc;

    # -------------------------------------------------------
    # Rate limiting
    # -------------------------------------------------------
    # 429 instead of the default 503: clients and SDKs back off on 429, while
    # 503 pollutes monitoring as if the service itself were down.
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;           # log throttled requests, so abuse is visible

    # One zone per traffic class. 10m of shared memory holds roughly 160k IPs.
    # `rate` is the sustained rate; each `limit_req` picks its own burst.
    limit_req_zone $binary_remote_addr zone=app:10m   rate=30r/s;  # page views
    limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;  # JSON endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=1r/s;   # login/register
    limit_req_zone $binary_remote_addr zone=minio:10m rate=20r/s;  # media files

    # Simultaneous connections per IP. limit_req caps the request *rate*;
    # without limit_conn there is no defense against slowloris (few requests,
    # many connections held open).
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # -------------------------------------------------------
    # Response cache (only for endpoints that opt in)
    # -------------------------------------------------------
    # Used today by /api/status and /sitemap.xml — both public and expensive.
    # This layer avoids even the cost of waking up Node.
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2          # spread files over subdirs
                     keys_zone=api_cache:10m
                     max_size=64m
                     inactive=10m        # drop entries nobody asked for in 10m
                     use_temp_path=off;  # write straight into the cache dir

    # Short client read timeouts — the other half of the slowloris defense,
    # against bodies/headers dribbled in byte by byte.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          15s;

    # -------------------------------------------------------
    # Upstreams — names match container_name in docker-compose
    # -------------------------------------------------------
    # `keepalive` holds idle connections open so each request doesn't pay for a
    # new TCP handshake. It only works together with the `proxy_http_version
    # 1.1` + empty `Connection` header set in proxy-params.inc.
    upstream app_upstream {
        server romulodm-app:3000;       # must match NEXT_PORT / PORT in the app
        keepalive 32;
    }

    upstream minio_upstream {
        server romulodm-minio:9000;
        keepalive 16;
    }

    # -------------------------------------------------------
    # Catch-all: reject any hostname we don't recognise
    # -------------------------------------------------------
    # Bots scanning the server's raw IP land here instead of being served the
    # real site under an unexpected Host header.
    server {
        listen 80 default_server;
        server_name _;
        return 444;                     # close the connection with no response
    }
    # Note: there is deliberately no HTTPS catch-all. A `listen 443 ssl
    # default_server` needs a certificate, and a missing one is a startup
    # [emerg]. Unknown hostnames over HTTPS fall through to the first 443 block
    # loaded (app.conf), which still requires a valid certificate for the name
    # the client asked for — so nothing leaks.

    # -------------------------------------------------------
    # Virtual hosts
    # In every environment conf.d/ contains exactly one generated default.conf,
    # written by envsubst in the compose entrypoint:
    #
    #   dev              <- templates/app.dev.conf   (no TLS)
    #   staging + prod   <- templates/app.conf       (same file, different vars)
    #
    # Anything in conf.d/ ending in .conf is loaded here. Templates and partials
    # must NOT live in this directory under a .conf name — see nginx/templates/
    # for templates and the .inc convention for partials.
    # -------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
