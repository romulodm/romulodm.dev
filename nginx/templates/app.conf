# ============================================================
#  Main virtual host — serves BOTH staging and production.
#
#  Serves the Next.js app and, under /media/, public read-only access to the
#  MinIO bucket. Everything else in the stack stays inside the Docker network.
#
#  NOT valid nginx config as it stands. The compose entrypoint runs `envsubst`
#  over it and writes the result to conf.d/default.conf, so the ${...} below are
#  shell placeholders:
#
#    ${SITE_DOMAIN}  romulodm.dev          | staging.romulodm.dev
#    ${WWW_DOMAIN}   www.romulodm.dev      | (empty — subdomains have no www)
#
#  ONE file for both environments, on purpose. Staging only earns its keep if it
#  is byte-for-byte the same configuration as production; two hand-maintained
#  files drift, and the drift is invisible until the day it matters. The only
#  differences between the two servers now live in environment variables.
#
#  Dev is the exception and uses app.dev.conf, because it has no TLS at all.
#
#  A NOTE ON `location` PRIORITY, because it bites here:
#  nginx does NOT pick the location that appears first. The order is
#    1. `location = /path`   exact match, wins outright
#    2. `location ^~ /path/` longest prefix, and STOPS regex matching
#    3. `location ~ ...`     regexes, in file order
#    4. `location /path/`    plain prefix — only if no regex matched
#  So a plain prefix like `/media/` loses to a regex like `\.(png)$` further
#  down the file. That is why the prefixes below are marked `^~`.
# ============================================================

# ── HTTP: redirect everything to HTTPS ───────────────────────
server {
    listen 80;
    server_name ${SITE_DOMAIN} ${WWW_DOMAIN};

    # Certbot's HTTP-01 challenge must stay on plain HTTP, so it is handled
    # before the redirect below. Renewals go through here; the FIRST issuance
    # uses --standalone (see init-ssl.sh), because this block cannot run before
    # the certificate it references exists.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the real site ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;   # separate directive: `listen ... http2` is deprecated since nginx 1.25

    server_name ${SITE_DOMAIN} ${WWW_DOMAIN};

    # ── TLS certificates (issued by Certbot) ─────────────────
    # These files must exist or nginx will not start at all. See init-ssl.sh
    # for the first issuance; renewal is automatic via the certbot container.
    #
    # Certbot names the directory after the FIRST domain passed to `certonly`,
    # which is why init-ssl.sh always passes $DOMAIN before www.$DOMAIN.
    ssl_certificate     /etc/letsencrypt/live/${SITE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SITE_DOMAIN}/privkey.pem;
    ssl_session_cache   shared:SSL:10m;   # reuse handshakes across requests
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;  # TLS 1.0/1.1 are broken and dropped
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;        # modern clients pick better than we do

    # ── Security headers ─────────────────────────────────────
    # Also carries the X-Robots-Tag that keeps staging out of search results.
    # WARNING: any location below that declares its own `add_header` loses all
    # of these and has to include this file again. See security-headers.inc.
    include /etc/nginx/conf.d/security-headers.inc;

    # ── General limits ───────────────────────────────────────
    client_max_body_size 10M;   # per-location overrides below where needed

    # Simultaneous connections per IP (anti-slowloris). Generous enough for
    # normal browsing over multiplexed HTTP/2.
    limit_conn conn_per_ip 30;

    # ── Health check for external monitoring ─────────────────
    # `default_type` instead of `add_header Content-Type`: add_header would wipe
    # every inherited security header on this response.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Block dotfiles that should never be reachable ────────
    # `return` runs before the access phase, so it alone decides the outcome;
    # a `deny all` next to it would be dead code. 404 rather than 403 so we
    # don't confirm the file exists.
    location ~ /\.(env|git|svn|htaccess|htpasswd) {
        return 404;
    }

    # ── Next.js build output (/_next/static) ─────────────────
    # Filenames are content-hashed, so these can be cached forever.
    # `^~` is required: without it the `\.(js|css)$` regex further down would
    # capture these requests and this block would never run.
    location ^~ /_next/static/ {
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        # One Cache-Control, set explicitly. Using `expires 1y` here as well
        # would emit a SECOND Cache-Control header alongside this one.
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Other static assets served by the app ────────────────
    # Anything under /public: favicons, fonts, og images... These names are not
    # hashed, so no `immutable` — 6 months with revalidation on change.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=15552000" always;
        access_log off;
    }

    # ── MinIO: public read-only access to the bucket ─────────
    #    Public URL: https://${SITE_DOMAIN}/media/<object>
    #    Writes and the admin API stay inside the Docker network — the app
    #    talks to MinIO directly, never through here.
    #
    #    `^~` is essential: media files end in .png/.webp/... and would
    #    otherwise be swallowed by the regex block above and proxied to the
    #    Next.js app instead of MinIO.
    location ^~ /media/ {
        limit_req zone=minio burst=40 nodelay;

        # Strip /media/ and map it onto the bucket. The bucket name is
        # hardcoded here and must match MINIO_BUCKET_NAME in .env.
        rewrite ^/media/(.*)$ /portfolio-blog/$1 break;

        proxy_pass http://minio_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        # Hide MinIO's internal request identifiers from public responses.
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;

        # Objects are written under content-addressed names, so they never
        # change under the same URL — safe to cache for a year.
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Block the MinIO console ──────────────────────────────
    #    Port 9001 is not published in docker-compose.prod.yml. This block is a
    #    second layer in case someone tries to reach it through a path.
    location ^~ /minio-console/ {
        return 403;
    }

    # ── Credential endpoints (brute-force targets) ───────────
    #    `=` (exact match) beats every prefix below, so these keep the strict
    #    `auth` zone. 1r/s with burst 5: nobody typing a password by hand
    #    exceeds that.
    #
    #    These are the only limits in the project that exist ONLY in nginx —
    #    the next-auth callback route does not go through the app's own
    #    rateLimit(). If this block disappears, brute force becomes unlimited
    #    and nothing in the application code notices.
    location = /api/auth/callback/credentials {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location = /api/auth/register {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location = /api/auth/forgot-password {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    # ── Public status endpoint: cached at the edge ───────────
    #    Anonymous and expensive (aggregations in Postgres). The app already
    #    caches it internally; here most requests never even reach Node.
    location = /api/status {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        proxy_cache api_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 503 5s;   # brief negative cache, so an outage doesn't amplify

        # When the key expires, exactly one request goes upstream; the rest
        # wait for it instead of becoming a stampede.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # If the upstream is down or slow, serve the stale copy rather than an
        # error, and refresh it in the background.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # This add_header would discard the server block's security headers —
        # hence the include right above it.
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Proxy-Cache $upstream_cache_status always;  # HIT/MISS, for debugging
    }

    # ── Sitemap: cached at the edge ──────────────────────────
    #    Public and expensive: every GET triggers a findMany with no `take` in
    #    Postgres. The route is force-dynamic out of necessity (SITE_URL and the
    #    queries only exist at runtime — see the comment in
    #    portfolio/app/sitemap.ts), so the app cannot cache it itself. Without
    #    this block the only defense is limit_req, and 30r/s per IP is still 30
    #    full table scans per second.
    #
    #    The content only changes when a post is published, and the audience is
    #    crawlers — a 1h TTL is invisible to Google.
    location = /sitemap.xml {
        # Smaller burst than `location /`: humans don't browse sitemaps, so a
        # burst here is either a bot or abuse.
        limit_req zone=app burst=10 nodelay;

        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        proxy_cache api_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;

        # MANDATORY here, unlike /api/status: that handler deliberately sends
        # `Cache-Control: public, s-maxage=...`. A metadata route with
        # force-dynamic sends `private, no-store`, and nginx obeys it — without
        # this line the whole block silently becomes a no-op.
        proxy_ignore_headers Cache-Control Expires;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # A database outage should not turn into a broken sitemap for crawlers.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # ── Contact form ─────────────────────────────────────────────
    #    `location =` is an exact match: it takes precedence over
    #    `location /api/` regardless of the order in the file
    #    (see the priority note at the top).
    #
    #    `client_max_body_size` of 8k is intentional: the longest
    #    message accepted by the application is 2000 characters,
    #    so any larger request body is considered abuse and is
    #    rejected here, before Node reads the payload.
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        client_max_body_size 8k;

        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── Everything else under /api/ ──────────────────────────
    #    Also covers /api/auth/session, /csrf, /providers and the OAuth
    #    callbacks, which next-auth polls frequently.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        # API responses are never cached at this layer.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── The Next.js app (everything else) ────────────────────
    location / {
        limit_req zone=app burst=50 nodelay;

        proxy_pass http://app_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        # Dynamic pages are rendered per request; never cache them here.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
