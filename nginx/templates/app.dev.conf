# ============================================================
#  Development virtual host — mirrors app.conf without TLS.
#
#  NOT loaded directly, and NOT valid nginx config as it stands.
#  docker-compose.dev.nginx.yml mounts this file as a template and the
#  entrypoint runs `envsubst` over it to expand ${NEXT_PORT}, writing the result
#  to conf.d/default.conf. That is why ${NEXT_PORT} below is a shell placeholder
#  and not nginx syntax.
#
#  WHY IT LIVES IN templates/ AND NOT IN conf.d/:
#  nginx.conf ends with `include conf.d/*.conf`, and docker-compose.prod.yml
#  mounts the WHOLE conf.d directory. While this file was named
#  conf.d/app.dev.conf it matched that glob in production, so nginx tried to
#  load it verbatim and died on startup with:
#      [emerg] invalid port in upstream "romulodm-app:${NEXT_PORT}"
#  A template is not a config file; keeping it outside conf.d is what makes that
#  structurally impossible rather than a rule someone has to remember.
#
#  The zones (app/api/auth/minio/conn_per_ip) come from nginx.conf, which is the
#  exact same file mounted in production. The `limit_req` lines below repeat the
#  ones in app.conf on purpose: without them, running
#  `scripts/check-rate-limits.mjs` against localhost only exercises the
#  application-level limiter and reports FAILURE on the endpoints that rely
#  solely on nginx (the credential ones), looking like a regression that isn't.
#
#  If you change a limit here, change its counterpart in app.conf.
# ============================================================

upstream app_dev_upstream {
    server romulodm-app:${NEXT_PORT};
    keepalive 32;
}

server {
    listen 80;
    server_name localhost romulodm.dev.local;

    # Anti-slowloris, same as production.
    limit_conn conn_per_ip 30;

    # Health check. `default_type` rather than `add_header Content-Type`, to
    # match production — see security-headers.inc for why that matters.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── MinIO public files ───────────────────────────────────
    #    `^~` for the same reason as in production: media filenames end in
    #    image extensions and must not be captured by any regex location.
    #    (There is no static-asset regex block in dev, but keeping the two
    #    files symmetric is what stops this from silently diverging.)
    #
    #    No upstream block here — dev talks to the MinIO container directly,
    #    which is fine at this traffic level.
    location ^~ /media/ {
        limit_req zone=minio burst=40 nodelay;

        rewrite ^/media/(.*)$ /portfolio-blog/$1 break;
        proxy_pass http://romulodm-minio:9000;
        include /etc/nginx/conf.d/proxy-params.inc;

        client_max_body_size 100M;
        proxy_request_buffering off;   # stream large bodies instead of buffering to disk
    }

    # ── Credential endpoints (brute-force targets) ───────────
    #    `=` (exact match) beats every prefix below.
    #    1r/s with burst 5: nobody typing a password by hand exceeds that.
    #
    #    These are the only limits in the project that exist ONLY in nginx: the
    #    callback route belongs to next-auth and does not go through the app's
    #    own rateLimit(). If this block disappears, brute force becomes
    #    unlimited and nothing in the application code notices.
    location = /api/auth/callback/credentials {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app_dev_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location = /api/auth/register {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app_dev_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location = /api/auth/forgot-password {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://app_dev_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    # ── Contact form ─────────────────────────────────────────────
    #    `location =` is an exact match: it takes precedence over
    #    `location /api/` regardless of the order in the file
    #    (see the priority note at the top).
    #
    #    `client_max_body_size` of 8k is intentional: the longest
    #    message accepted by the application is 2000 characters,
    #    so any larger request body is considered abuse and is
    #    rejected here, before Node reads the payload.
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        client_max_body_size 8k;

        proxy_pass http://app_dev_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── API ──────────────────────────────────────────────────
    #    No proxy_cache on /api/status here: in dev an edge cache only gets in
    #    the way of manual testing. The rate limit, however, is identical.
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app_dev_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── The Next.js app (everything else) ────────────────────
    #    proxy-params.inc carries the Upgrade/Connection pair that Next.js HMR
    #    needs over WebSocket.
    location / {
        limit_req zone=app burst=50 nodelay;

        proxy_pass http://app_dev_upstream;
        include /etc/nginx/conf.d/proxy-params.inc;
    }
}
