# Adicione este serviço ao seu docker-compose.yml existente
# e remova/ajuste os `ports` dos demais serviços conforme
# indicado nos comentários abaixo.

services:

  # ── NGINX (único serviço com porta exposta para o host) ────
  nginx:
    image: nginx:alpine
    container_name: romulodm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro          # webroot do certbot
      - certbot_certs:/etc/letsencrypt:ro        # certificados
    depends_on:
      - app
      - minio
    networks:
      - romulodm-network

  # ── Certbot (renovação automática de certificado) ──────────
  certbot:
    image: certbot/certbot
    container_name: romulodm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renova a cada 12h; sai silenciosamente se não for necessário
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    networks:
      - romulodm-network

volumes:
  certbot_www:
  certbot_certs: