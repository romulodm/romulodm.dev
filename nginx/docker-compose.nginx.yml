# Adicione este serviço ao seu docker-compose.yml existente
# e remova/ajuste os `ports` dos demais serviços conforme
# indicado nos comentários abaixo.

services:

  # ── NGINX (único serviço com porta exposta para o host) ────
  nginx:
    image: nginx:alpine
    container_name: romulodm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro          # webroot do certbot
      - certbot_certs:/etc/letsencrypt:ro        # certificados
    depends_on:
      - app
      - minio
    networks:
      - romulodm-network

  # ── Certbot (renovação automática de certificado) ──────────
  certbot:
    image: certbot/certbot
    container_name: romulodm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renova a cada 12h; sai silenciosamente se não for necessário
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    networks:
      - romulodm-network

  # ── Ajustes nos serviços existentes ───────────────────────
  #
  # REMOVA ou comente os `ports` dos serviços abaixo.
  # Eles continuam acessíveis internamente pela rede Docker,
  # mas nenhuma porta fica exposta no host de produção.
  #
  # postgres:
  #   ports:           ← REMOVER em produção
  #     - "5432:5432"
  #
  # umami-db:
  #   ports:           ← REMOVER em produção
  #     - "5433:5432"
  #
  # minio:
  #   ports:
  #     - "9000:9000"  ← REMOVER em produção (nginx faz o proxy)
  #     - "9001:9001"  ← REMOVER em produção (console só via túnel SSH)
  #
  # redis:
  #   ports:           ← REMOVER em produção
  #     - "6379:6379"
  #
  # mailcatcher:
  #   ports:           ← REMOVER em produção
  #     - "..."
  #
  # waha:
  #   ports:           ← REMOVER em produção
  #     - "3002:3000"
  #
  # umami:
  #   ports:           ← REMOVER em produção (ou expor só via nginx)
  #     - "..."

volumes:
  certbot_www:
  certbot_certs: