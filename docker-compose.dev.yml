name: 'romulodm.dev'

services:
  postgres:
    image: postgres:16-alpine
    container_name: romulodm-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  mailcatcher:
    image: sj26/mailcatcher
    container_name: mailcatcher
    env_file:
      - .env
    expose:
      - '${SMTP_PORT}'
      - '${HTTP_PORT}'
    ports:
      - '${SMTP_PORT}:1025'
      - '${HTTP_PORT}:1080'
    networks:
    - romulodm-network

  minio:
    image: minio/minio:latest
    container_name: romulodm-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - romulodm-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: romulodm-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET_NAME} &&
        mc anonymous set download local/$${MINIO_BUCKET_NAME} &&
        echo '✅ Bucket $${MINIO_BUCKET_NAME} pronto.'
      "
    networks:
      - romulodm-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: romulodm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - romulodm-network

  worker:
    build:
      context: .            
      dockerfile: worker/Dockerfile
    container_name: romulodm-worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - romulodm-network

  search-go:
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: romulodm-search
    restart: unless-stopped
    environment:
      PORT: 8080
      SNAPSHOT_PATH: /data/documents.json
      SEARCH_INTERNAL_SECRET: ${SEARCH_INTERNAL_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - search_data:/data
    networks:
      - romulodm-network

  app:
    build:
      context: .
      dockerfile: portfolio/Dockerfile
    container_name: romulodm-app
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - '${NEXT_PORT}:${NEXT_PORT}'
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - romulodm-network

volumes:
  postgres_data:
  minio_data:
  redis_data:
  search_data:

networks:
  romulodm-network:
    driver: bridge
