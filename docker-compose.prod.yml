name: 'romulodm.dev'

services:
  postgres:
    image: postgres:16-alpine
    container_name: romulodm-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  minio:
    image: minio/minio:latest
    container_name: romulodm-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - romulodm-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    # minio/mc was removed from Docker Hub (and quay.io). The server image ships
    # the same `mc` binary (the healthcheck above already relies on it).
    image: minio/minio:latest
    container_name: romulodm-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET_NAME} &&
        mc anonymous set download local/$${MINIO_BUCKET_NAME} &&
        echo '✅ Bucket $${MINIO_BUCKET_NAME} pronto.'
      "
    networks:
      - romulodm-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: romulodm-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - romulodm-network

  worker:
    image: ghcr.io/${GHCR_OWNER:-romulodm}/romulodm-worker:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: romulodm-worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - romulodm-network

  search-go:
    image: ghcr.io/${GHCR_OWNER:-romulodm}/romulodm-search:${APP_TAG:-latest}
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: romulodm-search
    restart: unless-stopped
    environment:
      PORT: 8080
      SNAPSHOT_PATH: /data/documents.json
      SEARCH_INTERNAL_SECRET: ${SEARCH_INTERNAL_SECRET:?defina SEARCH_INTERNAL_SECRET no .env}
    volumes:
      - search_data:/data
    networks:
      - romulodm-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app:
    image: ghcr.io/${GHCR_OWNER:-romulodm}/romulodm-app:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: portfolio/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-}
        NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_WALLET_ADDRESS: ${NEXT_PUBLIC_WALLET_ADDRESS:-}
        NEXT_PUBLIC_ENCRYPTION_PUBLIC_KEY: ${NEXT_PUBLIC_ENCRYPTION_PUBLIC_KEY:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_TERMINAL_SECRET_PASSWORD: ${NEXT_PUBLIC_TERMINAL_SECRET_PASSWORD:-}
        NEXT_PUBLIC_TERMINAL_SECRET_REWARD: ${NEXT_PUBLIC_TERMINAL_SECRET_REWARD:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      secrets:
        - sentry_auth_token
    container_name: romulodm-app
    env_file:
      - .env
    environment:
      SITE_URL: ${SITE_URL:?defina SITE_URL no .env}
      ROBOTS_ALLOW_INDEXING: ${ROBOTS_ALLOW_INDEXING:-false}
      SEARCH_GO_URL: http://search-go:8080
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - redis
      - search-go
    networks:
      - romulodm-network

  migrate:
    image: ghcr.io/${GHCR_OWNER:-romulodm}/romulodm-migrator:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: portfolio/Dockerfile
      target: migrator
    container_name: romulodm-migrate
    profiles: [tools]
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - romulodm-network
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: romulodm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?defina SITE_DOMAIN no .env}
      - WWW_DOMAIN=${WWW_DOMAIN:-}

    # Keep the envsubst command on ONE line. In a folded scalar (`>`), lines
    # indented deeper than the first keep their newlines, so splitting the
    # redirections across lines makes the shell run `envsubst` on empty stdin
    # and then `> default.conf` on its own: nginx starts with an EMPTY vhost and
    # every request falls into the 444 catch-all in nginx.conf.
    entrypoint: >
      /bin/sh -c "envsubst '$$SITE_DOMAIN $$WWW_DOMAIN' < /etc/nginx/templates/app.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/app.conf:/etc/nginx/templates/app.conf:ro
      - ./nginx/conf.d/proxy-params.inc:/etc/nginx/conf.d/proxy-params.inc:ro
      - ./nginx/conf.d/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ./nginx/conf.d/cloudflare-real-ip.inc:/etc/nginx/conf.d/cloudflare-real-ip.inc:ro

      - ./nginx/logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
      - minio
    networks:
      - romulodm-network

  certbot:
    image: certbot/certbot
    container_name: romulodm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    networks:
      - romulodm-network

  backup:
    profiles: [prod]
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: romulodm-backup
    env_file:
      - .env
    environment:
      BACKUP_RETENTION_DAYS: 7
      TZ: America/Sao_Paulo
    depends_on:
      - postgres
    networks:
      - romulodm-network
    restart: "no"
 
  cron:
    profiles: [prod]
    image: mcuadros/ofelia:latest
    container_name: romulodm-cron
    restart: unless-stopped
    depends_on:
      - backup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./cron/config.ini:/etc/ofelia/config.ini:ro
    networks:
      - romulodm-network

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  postgres_data:
  minio_data:
  redis_data:
  search_data:
  certbot_www:
  certbot_certs:

networks:
  romulodm-network:
    driver: bridge