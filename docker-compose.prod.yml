version: '3.8'
name: 'romulodm.dev'

services:
  postgres:
    image: postgres:16-alpine
    container_name: romulodm-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  minio:
    image: minio/minio:latest
    container_name: romulodm-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - romulodm-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: romulodm-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET_NAME} &&
        mc anonymous set download local/$${MINIO_BUCKET_NAME} &&
        echo '✅ Bucket $${MINIO_BUCKET_NAME} pronto.'
      "
    networks:
      - romulodm-network
    restart: "no"

  umami-db:
    image: postgres:16-alpine
    container_name: romulodm-umami-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${UMAMI_DB}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: romulodm-umami
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami-db:5432/${UMAMI_DB}
      APP_SECRET: ${APP_SECRET}
      REDIS_URL: redis://redis:6379
    depends_on:
      - umami-db
      - redis
    restart: unless-stopped
    networks:
      - romulodm-network

  redis:
    image: redis:7-alpine
    container_name: romulodm-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - romulodm-network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: romulodm-worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - romulodm-network

  app:
    build:
      context: .
      dockerfile: portfolio/Dockerfile
    container_name: romulodm-app
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - romulodm-network

  nginx:
    image: nginx:alpine
    container_name: romulodm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
      - minio
    networks:
      - romulodm-network

  certbot:
    image: certbot/certbot
    container_name: romulodm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    networks:
      - romulodm-network

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: romulodm-backup
    env_file:
      - .env
    environment:
      BACKUP_RETENTION_DAYS: 7   # quantos dias manter no bucket
      TZ: America/Sao_Paulo
    depends_on:
      - postgres
      - umami-db
    networks:
      - romulodm-network
    restart: "no"   # não reinicia — é executado pelo cron abaixo
 
  # ── Cron que dispara o backup ─────────────────────────────
  # Usa a imagem "mcuadros/ofelia" — scheduler leve para Docker
  cron:
    image: mcuadros/ofelia:latest
    container_name: romulodm-cron
    restart: unless-stopped
    depends_on:
      - backup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./cron/config.ini:/etc/ofelia/config.ini:ro
    networks:
      - romulodm-network

volumes:
  postgres_data:
  umami_postgres_data:
  minio_data:
  redis_data:
  certbot_www:
  certbot_certs:

networks:
  romulodm-network:
    driver: bridge