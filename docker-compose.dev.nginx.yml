name: 'nginx/romulodm.dev'

services:
  postgres:
    image: postgres:16-alpine
    container_name: romulodm-db
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - romulodm-network

  mailcatcher:
    image: sj26/mailcatcher
    container_name: mailcatcher
    env_file:
      - .env
    expose:
      - '${SMTP_PORT}'
      - '${HTTP_PORT}'
    ports:
      - '${SMTP_PORT}:1025'
      - '${HTTP_PORT}:1080'
    networks:
      - romulodm-network

  minio:
    image: minio/minio:latest
    container_name: romulodm-minio
    env_file:
      - .env
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"  # console acessível diretamente em dev
    volumes:
      - minio_data:/data
    networks:
      - romulodm-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: romulodm-minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET_NAME} &&
        mc anonymous set download local/$${MINIO_BUCKET_NAME} &&
        echo '✅ Bucket $${MINIO_BUCKET_NAME} pronto.'
      "
    networks:
      - romulodm-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: romulodm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - romulodm-network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: romulodm-worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - romulodm-network

  search-go:
    build:
      context: ./search
      dockerfile: Dockerfile
    container_name: romulodm-search
    restart: unless-stopped
    environment:
      PORT: 8080
      SNAPSHOT_PATH: /data/documents.json
      SEARCH_INTERNAL_SECRET: ${SEARCH_INTERNAL_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - search_data:/data
    networks:
      - romulodm-network

  app:
    build:
      context: .
      dockerfile: portfolio/Dockerfile
      # As NEXT_PUBLIC_* são inlinadas em BUILD time pelo Next — inclusive no
      # bundle de servidor. Sem passá-las como args aqui, o `env_file` abaixo
      # não adianta: o valor já foi congelado como "" durante o build, e o
      # código lê string vazia em runtime. Foi o que fazia
      # `GET /api/newsletter/unsubscribe/<token>` responder 500 em dev
      # (NextResponse.redirect("")) e funcionar em produção, onde o
      # docker-compose.prod.yml passa os mesmos args.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-}
        NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_WALLET_ADDRESS: ${NEXT_PUBLIC_WALLET_ADDRESS:-}
        NEXT_PUBLIC_ENCRYPTION_PUBLIC_KEY: ${NEXT_PUBLIC_ENCRYPTION_PUBLIC_KEY:-}
    container_name: romulodm-app
    env_file:
      - .env
    restart: unless-stopped
    # Sem ports — o nginx faz o proxy.
    # Acesso direto: http://localhost (porta 80 via nginx)
    # Se precisar acessar o app diretamente sem nginx, descomente:
    # ports:
    #   - '${NEXT_PORT}:${NEXT_PORT}'
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - romulodm-network

  nginx:
    image: nginx:alpine
    container_name: romulodm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NEXT_PORT=${NEXT_PORT}
    entrypoint: >
      /bin/sh -c "
        envsubst '$$NEXT_PORT' < /etc/nginx/templates/app.dev.conf > /etc/nginx/conf.d/default.conf &&
        nginx -g 'daemon off;'
      "
    volumes:
      # Fica em nginx/templates/, fora de conf.d/, porque não é config válida
      # até o envsubst rodar. Enquanto morava em conf.d/ ele casava com o
      # `include conf.d/*.conf` do nginx.conf e derrubava o nginx em produção
      # com `[emerg] invalid port in upstream "romulodm-app:${NEXT_PORT}"`.
      - ./nginx/templates/app.dev.conf:/etc/nginx/templates/app.dev.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Montado individualmente, e não a conf.d inteira, por dois motivos:
      # o entrypoint precisa ESCREVER o default.conf gerado ali dentro (um
      # mount `:ro` da pasta impediria), e dev não deve carregar o
      # security-headers.inc, que depende do $robots_tag definido só quando há
      # TLS. A extensão .inc mantém o arquivo fora do `include conf.d/*.conf`.
      - ./nginx/conf.d/proxy-params.inc:/etc/nginx/conf.d/proxy-params.inc:ro
    depends_on:
      - app
      - minio
    networks:
      - romulodm-network

volumes:
  postgres_data:
  minio_data:
  redis_data:
  search_data:

networks:
  romulodm-network:
    driver: bridge